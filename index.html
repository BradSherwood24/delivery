<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wyatts Pizzeria – Order Status</title>
<meta name="theme-color" content="#ffffff">
<script>
  // ============================================================
  //  EDIT THESE TO UPDATE THE PAGE
  // ============================================================
  //  CURRENT_STEP:  1 = Order received
  //                 2 = In the oven
  //                 3 = Out for delivery
  //                 4 = Delivered
  const CURRENT_STEP = 2;

  //  GIF_URL: path or link to the pizza-toss GIF.
  //  e.g. "pizza.gif" (file in this repo) or a full https:// link.
  //  Leave as "" to show the placeholder box.
  const GIF_URL = "";
  // ============================================================
</script>
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --line: #e3e3e0;
    --accent: #9e2a1f;   /* muted brick red, used sparingly */
    --done: #2e6b47;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  }
  .header-inner {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: .2px;
  }
  header span { color: var(--muted); font-size: .85rem; }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 18px;
    margin-bottom: 14px;
  }

  .status-label {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 0;
  }
  .status-now {
    font-size: 1.45rem;
    font-weight: 600;
    margin: 4px 0 18px;
  }

  .bar {
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width 1s ease;
  }
  .bar-fill.done { background: var(--done); }

  ol.steps {
    list-style: none;
    margin: 22px 0 0;
    padding: 0;
  }
  ol.steps li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 0;
    position: relative;
    color: var(--muted);
  }
  ol.steps li:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 10px;
    top: 34px;
    width: 2px;
    height: calc(100% - 22px);
    background: var(--line);
  }
  ol.steps li.complete:not(:last-child)::after { background: var(--ink); }
  .dot {
    flex: 0 0 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--card);
    display: grid;
    place-items: center;
  }
  .dot svg { width: 12px; height: 12px; }
  .step-name { font-size: 1rem; }
  li.complete .dot { background: var(--ink); border-color: var(--ink); color: #fff; }
  li.complete .step-name { color: var(--ink); }
  li.current .dot { border-color: var(--accent); }
  li.current .dot::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  li.current .step-name { color: var(--ink); font-weight: 600; }
  li.current.final .dot { background: var(--done); border-color: var(--done); color: #fff; }
  li.current.final .dot::before { display: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .35; }
  }

  .gif-wrap { padding: 0; overflow: hidden; }
  .gif-wrap img { display: block; width: 100%; height: auto; }
  .gif-placeholder {
    aspect-ratio: 4 / 3;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
    background: #fafaf8;
    font-size: .9rem;
    padding: 12px;
  }

  .contact {
    text-align: center;
    color: var(--muted);
    font-size: .9rem;
    padding: 6px 8px 0;
  }
  .contact strong { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .bar-fill { transition: none; }
    li.current .dot::before { animation: none; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Wyatts Pizzeria</h1>
    <span>Order status</span>
  </div>
</header>

<main>
  <section class="card" aria-live="polite">
    <p class="status-label">Current status</p>
    <p class="status-now" id="statusNow"></p>
    <div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="4" id="bar">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="card gif-wrap" id="gifCard"></section>

  <p class="contact">
    If you have any questions, <strong>feel free to not contact us.</strong>
  </p>
</main>

<script>
  const STEPS = ["Order received", "In the oven", "Out for delivery", "Delivered"];
  const CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.2 2.2L9.5 3.8"/></svg>';

  const step = Math.min(Math.max(parseInt(CURRENT_STEP, 10) || 1, 1), STEPS.length);
  const isDone = step === STEPS.length;

  document.getElementById("statusNow").textContent = STEPS[step - 1];

  // Progress bar (step 1 shows a sliver, last step is 100%)
  const pct = ((step - 1) / (STEPS.length - 1)) * 100;
  const fill = document.getElementById("barFill");
  fill.classList.toggle("done", isDone);
  document.getElementById("bar").setAttribute("aria-valuenow", step);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.width = Math.max(pct, 5) + "%";
  }));

  // Step list
  const list = document.getElementById("steps");
  STEPS.forEach((name, i) => {
    const n = i + 1;
    const li = document.createElement("li");
    if (n < step) li.className = "complete";
    else if (n === step) li.className = "current" + (isDone ? " final" : "");
    const mark = n < step || (isDone && n === step) ? CHECK : "";
    li.innerHTML = `<span class="dot">${mark}</span><span class="step-name">${name}</span>`;
    list.appendChild(li);
  });

  // GIF slot
  const gifCard = document.getElementById("gifCard");
  if (GIF_URL) {
    const img = document.createElement("img");
    img.src = GIF_URL;
    img.alt = "Pizza chef tossing dough in the air";
    gifCard.appendChild(img);
  } else {
    gifCard.innerHTML = '<div class="gif-placeholder">Image coming soon</div>';
  }
</script>
</body>
</html>
