<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wyatts Pizzeria – Order Status</title>
<meta name="theme-color" content="#ffffff">
<script>
  // ============================================================
  //  EDIT THESE TO UPDATE THE PAGE
  // ============================================================
  //  CURRENT_STEP:  1 = Order received
  //                 2 = In the oven
  //                 3 = Out for delivery
  //                 4 = Delivered
  const CURRENT_STEP = 3;

  //  GIF_URL: path or link to the pizza-toss GIF.
  //  e.g. "pizza.gif" (file in this repo) or a full https:// link.
  //  Leave as "" to show the placeholder box.
  const GIF_URL = "pizza.gif";

  //  NOTES: "Notes from the kitchen". Add a line per note.
  //  time format: "YYYY-MM-DD h:mm AM/PM". Order doesn't matter,
  //  newest always shows first. Empty list = section hidden.
  const NOTES = [
    { time: "2026-11-02 10:59 PM", text: "The kitchen has good lemon shaved ice" },
    { time: "2026-11-02 11:10 PM", text: "The kitchen gives out free grippy socks" },
  ];
  // ============================================================
</script>
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --line: #e3e3e0;
    --accent: #6fa8d6;   /* baby blue */
    --accent-soft: #e6f1fa;
    --accent-ink: #2f6690;
    --done: #2e6b47;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  }
  header { border-bottom: 3px solid var(--accent); }
  .header-inner {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    text-decoration: none;
    color: var(--ink);
  }
  .logo-mark { width: 42px; height: 42px; flex: 0 0 42px; }
  .logo-text { display: flex; flex-direction: column; line-height: 1; }
  .logo-name {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 1.45rem;
    font-weight: 600;
  }
  .logo-sub {
    font-size: .62rem;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--accent-ink);
    margin-top: 4px;
    font-weight: 600;
  }
  header .tag { color: var(--muted); font-size: .8rem; }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 18px;
    margin-bottom: 14px;
  }

  .status-label {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 0;
  }
  .status-now {
    font-size: 1.45rem;
    font-weight: 600;
    margin: 4px 0 18px;
  }

  .bar {
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width 1s ease;
  }
  .bar-fill.done { background: var(--done); }

  ol.steps {
    list-style: none;
    margin: 22px 0 0;
    padding: 0;
  }
  ol.steps li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 0;
    position: relative;
    color: var(--muted);
  }
  ol.steps li:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 10px;
    top: 34px;
    width: 2px;
    height: calc(100% - 22px);
    background: var(--line);
  }
  ol.steps li.complete:not(:last-child)::after { background: var(--ink); }
  .dot {
    flex: 0 0 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--card);
    display: grid;
    place-items: center;
  }
  .dot svg { width: 12px; height: 12px; }
  .step-name { font-size: 1rem; }
  li.complete .dot { background: var(--ink); border-color: var(--ink); color: #fff; }
  li.complete .step-name { color: var(--ink); }
  li.current .dot { border-color: var(--accent); }
  li.current .dot::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  li.current .step-name { color: var(--ink); font-weight: 600; }
  li.current.final .dot { background: var(--done); border-color: var(--done); color: #fff; }
  li.current.final .dot::before { display: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .35; }
  }

  .gif-wrap { padding: 0; overflow: hidden; }
  .gif-wrap img { display: block; width: 100%; height: auto; }
  .gif-placeholder {
    aspect-ratio: 4 / 3;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
    background: #fafaf8;
    font-size: .9rem;
    padding: 12px;
  }

  .contact { text-align: center; }
  .contact h2 {
    margin: 0 0 12px;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .contact button {
    appearance: none;
    width: 100%;
    max-width: 320px;
    min-height: 48px;
    padding: 12px 18px;
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .contact button:active { background: #d4e7f6; }

  .notes h2 {
    margin: 0 0 4px;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .notes ul { list-style: none; margin: 0; padding: 0; }
  .notes li {
    padding: 12px 0 12px 14px;
    border-left: 3px solid var(--accent);
    margin-top: 10px;
    background: linear-gradient(90deg, var(--accent-soft), transparent 70%);
    border-radius: 0 8px 8px 0;
  }
  .notes time {
    display: block;
    font-size: .75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 2px;
  }
  .notes p { margin: 0; padding-right: 10px; }

  @media (prefers-reduced-motion: reduce) {
    .bar-fill { transition: none; }
    li.current .dot::before { animation: none; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1 class="logo" aria-label="Wyatts Pizzeria">
      <svg class="logo-mark" viewBox="0 0 42 42" aria-hidden="true">
        <circle cx="21" cy="21" r="20" fill="#e6f1fa" stroke="#6fa8d6" stroke-width="2"/>
        <path d="M21 9 L32 30 Q21 35 10 30 Z" fill="#f3d9a4" stroke="#1c1c1c" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M10 30 Q21 35 32 30" fill="none" stroke="#c98a3e" stroke-width="3" stroke-linecap="round"/>
        <circle cx="20" cy="19" r="2" fill="#9e2a1f"/>
        <circle cx="24" cy="25" r="2" fill="#9e2a1f"/>
        <circle cx="17" cy="26" r="1.8" fill="#9e2a1f"/>
      </svg>
      <span class="logo-text">
        <span class="logo-name">Wyatts</span>
        <span class="logo-sub">Pizzeria</span>
      </span>
    </h1>
    <span class="tag">Order status</span>
  </div>
</header>

<main>
  <section class="card" aria-live="polite">
    <p class="status-label">Current status</p>
    <p class="status-now" id="statusNow"></p>
    <div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="4" id="bar">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="card gif-wrap" id="gifCard"></section>

  <section class="card contact">
    <h2>Have questions?</h2>
    <button type="button">Please feel free to not contact us</button>
  </section>

  <section class="card notes" id="notesCard" hidden>
    <h2>Notes from the kitchen</h2>
    <ul id="notesList"></ul>
  </section>
</main>

<script>
  const STEPS = ["Order received", "In the oven", "Out for delivery", "Delivered"];
  const CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.2 2.2L9.5 3.8"/></svg>';

  const step = Math.min(Math.max(parseInt(CURRENT_STEP, 10) || 1, 1), STEPS.length);
  const isDone = step === STEPS.length;

  document.getElementById("statusNow").textContent = STEPS[step - 1];

  // Progress bar (step 1 shows a sliver, last step is 100%)
  const pct = ((step - 1) / (STEPS.length - 1)) * 100;
  const fill = document.getElementById("barFill");
  fill.classList.toggle("done", isDone);
  document.getElementById("bar").setAttribute("aria-valuenow", step);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.width = Math.max(pct, 5) + "%";
  }));

  // Step list
  const list = document.getElementById("steps");
  STEPS.forEach((name, i) => {
    const n = i + 1;
    const li = document.createElement("li");
    if (n < step) li.className = "complete";
    else if (n === step) li.className = "current" + (isDone ? " final" : "");
    const mark = n < step || (isDone && n === step) ? CHECK : "";
    li.innerHTML = `<span class="dot">${mark}</span><span class="step-name">${name}</span>`;
    list.appendChild(li);
  });

  // GIF slot
  const gifCard = document.getElementById("gifCard");
  if (GIF_URL) {
    const img = document.createElement("img");
    img.src = GIF_URL;
    img.alt = "Pizza chef tossing dough in the air";
    gifCard.appendChild(img);
  } else {
    gifCard.innerHTML = '<div class="gif-placeholder">Image coming soon</div>';
  }

  // Notes from the kitchen (newest first)
  function parseNoteTime(s) {
    const m = String(s).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2})\s*([AaPp][Mm])?$/);
    if (!m) return null;
    let h = +m[4];
    if (m[6]) { const pm = /p/i.test(m[6]); if (h === 12) h = 0; if (pm) h += 12; }
    return new Date(+m[1], +m[2] - 1, +m[3], h, +m[5]);
  }
  function formatNoteTime(d) {
    const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const today = new Date();
    if (d.toDateString() === today.toDateString()) return "Today, " + t;
    return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + t;
  }
  const notes = (typeof NOTES !== "undefined" ? NOTES : [])
    .map(n => ({ ...n, date: parseNoteTime(n.time) }))
    .sort((a, b) => (b.date || 0) - (a.date || 0));
  if (notes.length) {
    const ul = document.getElementById("notesList");
    notes.forEach(n => {
      const li = document.createElement("li");
      const time = document.createElement("time");
      time.textContent = n.date ? formatNoteTime(n.date) : n.time;
      const p = document.createElement("p");
      p.textContent = n.text;
      li.append(time, p);
      ul.appendChild(li);
    });
    document.getElementById("notesCard").hidden = false;
  }
</script>
</body>
</html>
